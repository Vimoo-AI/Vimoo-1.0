name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install "pytest>=8,<9" "ruff==0.9.10"
      - run: ruff check examples tests
      - run: python -m compileall -q examples
      - name: Example entry points
        run: python -m pytest tests -q -rs
